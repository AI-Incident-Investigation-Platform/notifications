apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
spec:
  replicas: 2
  selector:
    matchLabels: {app: notifications}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: notifications}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notifications
          image: aiip-notifications:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8010
          envFrom:
            - secretRef: {name: notifications}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  selector: {app: notifications}
  ports:
    - name: http
      port: 8010
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notifications
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/inbox
            pathType: Prefix
            backend: &notifications_backend
              service: {name: notifications, port: {name: http}}
          - path: /api/v1/notification-preferences
            pathType: Prefix
            backend: *notifications_backend
          - path: /api/v1/channels
            pathType: Prefix
            backend: *notifications_backend
          - path: /api/v1/webhooks
            pathType: Prefix
            backend: *notifications_backend
          - path: /internal/v1/telegram/updates
            pathType: Exact
            backend: *notifications_backend
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: notifications-project-routes
spec:
  entryPoints: [web]
  routes:
    - match: PathRegexp(`^/api/v1/projects/[^/]+/webhooks(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: notifications
          port: 8010
