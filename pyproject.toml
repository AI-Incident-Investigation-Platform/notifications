[project]
name = "notifications"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["aiip-kit @ https://github.com/AI-Incident-Investigation-Platform/aiip-kit/archive/refs/tags/v0.1.0.tar.gz", "alembic>=1.20", "asyncpg>=0.32", "fastapi>=0.143", "httpx>=0.28", "pydantic-settings>=2.16", "redis>=6", "sqlalchemy[asyncio]>=2.0,<2.1", "uvicorn>=0.54"]
[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.15.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]
[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
